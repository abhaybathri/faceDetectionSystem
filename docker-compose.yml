version: "3.9"

services:
  faceattend:
    build: .
    container_name: faceattend
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database
      - ./data:/app/backend/data
    environment:
      - SECRET_KEY=change-me-in-production
      - FLASK_ENV=production
    restart: unless-stopped
